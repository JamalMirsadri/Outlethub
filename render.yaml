services:
  - type: web
    name: outlethub-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build:server
    preDeployCommand: npm run prisma:deploy
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: outlethub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: outlethub-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REFRESH_TOKEN_COOKIE_NAME
        value: outlethub_refresh_token
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: keyvalue
    name: outlethub-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: outlethub-db
    plan: free
    databaseName: outlethub
    user: outlethub
